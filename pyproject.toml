[tool.poetry]
name = "convfinqa-agent"
version = "0.1.0"
description = "LLM-driven conversational QA agent for financial documents using ConvFinQA dataset"
authors = ["Sophie Chong"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
langgraph = "^0.2"
langchain-google-genai = "^2.0"
pydantic = "^2.0"
pydantic-settings = "^2.0"
typer = "^0.9.0"
click = ">=8.0.0,<8.1.0"
rich = "^13.0"
python-dotenv = "^1.0"
ipykernel = "^7.1.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.0"
pytest-cov = "^4.0"
pytest-asyncio = "^0.23"
ruff = "^0.4"
mypy = "^1.10"
jupyter = "^1.1.1"

[tool.poetry.scripts]
convfinqa = "src.cli.main:app"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
fix = true
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "Q", "N"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"src/cli/**/*.py" = ["B008"]
"src/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = false
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
